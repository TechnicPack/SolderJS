name: Docker image diff

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: docker-image-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  describe:
    if: github.event.pull_request.user.login == 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Inspect registry metadata only; never check out or execute PR code.
      - name: Compare pinned Docker images
        uses: TechnicPack/docker-image-diff@cb44cf43eedd61c9160a87cc21fc65091c277241 # v1.2.2
        with:
          allowed-registries: docker.io
