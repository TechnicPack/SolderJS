name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

  integration:
    name: PostgreSQL and Redis integration (Node.js ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 24
            postgresPort: 15432
            redisPort: 16379
          - node: 26
            postgresPort: 25432
            redisPort: 26379
    services:
      postgres:
        image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: solder
          POSTGRES_PASSWORD: solder
          POSTGRES_DB: solder
        ports:
          - ${{ matrix.postgresPort }}:5432
        options: >-
          --health-cmd "pg_isready -U solder -d solder"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
        ports:
          - ${{ matrix.redisPort }}:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize test schema
        env:
          PGPASSWORD: solder
          PGPORT: ${{ matrix.postgresPort }}
        run: >-
          docker run --rm --interactive --network host --env PGPASSWORD
          postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2 psql --host=localhost --port="$PGPORT"
          --username=solder --dbname=solder < test/fixtures/schema.sql

      - name: Run integration tests
        env:
          SOLDERJS_ALLOW_DESTRUCTIVE_TESTS: '1'
          DATABASE_URL: postgres://solder:solder@localhost:${{ matrix.postgresPort }}/solder
          REDIS_HOST: localhost
          REDIS_PORT: ${{ matrix.redisPort }}
        run: pnpm test:integration
