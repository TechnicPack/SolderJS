name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

  integration:
    name: PostgreSQL and Redis integration (Node.js ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 24
            postgresPort: 15432
            redisPort: 16379
          - node: 26
            postgresPort: 25432
            redisPort: 26379
    services:
      postgres:
        image: postgres:18-alpine@sha256:83148c0bc09eac4d598b70a61e1404d0212b76c95c504bfd6c81a4c59ec91792
        env:
          POSTGRES_USER: solder
          POSTGRES_PASSWORD: solder
          POSTGRES_DB: solder
        ports:
          - ${{ matrix.postgresPort }}:5432
        options: >-
          --health-cmd "pg_isready -U solder -d solder"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:8-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
        ports:
          - ${{ matrix.redisPort }}:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize test schema
        env:
          PGPASSWORD: solder
          PGPORT: ${{ matrix.postgresPort }}
        run: >-
          docker run --rm --interactive --network host --env PGPASSWORD
          postgres:18-alpine@sha256:83148c0bc09eac4d598b70a61e1404d0212b76c95c504bfd6c81a4c59ec91792 psql --host=localhost --port="$PGPORT"
          --username=solder --dbname=solder < test/fixtures/schema.sql

      - name: Run integration tests
        env:
          SOLDERJS_ALLOW_DESTRUCTIVE_TESTS: "1"
          DATABASE_URL: postgres://solder:solder@localhost:${{ matrix.postgresPort }}/solder
          REDIS_HOST: localhost
          REDIS_PORT: ${{ matrix.redisPort }}
        run: pnpm test:integration
