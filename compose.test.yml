services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: solder
      POSTGRES_PASSWORD: solder
      POSTGRES_DB: solder
    ports:
      - '5433:5432'
    volumes:
      - ./test/fixtures/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U solder -d solder']
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 15
